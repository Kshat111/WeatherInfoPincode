spring:
  datasource:
    url: jdbc:h2:mem:weatherdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  main:
    allow-bean-definition-overriding: true

server:
  port: 8080

logging:
  level:
    root: INFO

openweather:
  apiKey: ${OPENWEATHER_API_KEY:}
  defaultCountry: IN
