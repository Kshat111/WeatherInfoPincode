spring:
  datasource:
    url: jdbc:mysql://localhost:3306/weatherdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

logging:
  level:
    root: INFO

openweather:
  apiKey: ${OPENWEATHER_API_KEY:}
  defaultCountry: IN
